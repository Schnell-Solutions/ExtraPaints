# Shared proxy and upload limits
client_max_body_size 12M;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

server {
    listen 80;
    server_name extrapaints.co.ke www.extrapaints.co.ke;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name extrapaints.co.ke www.extrapaints.co.ke;

    ssl_certificate /etc/letsencrypt/live/extrapaints.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/extrapaints.co.ke/privkey.pem;
    include /etc/nginx/conf.d/ssl_params.conf;

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
