# Staging overlay — use alongside docker-compose.yml on the SAME server as old production.
# Old site keeps ports 80/443. Staging uses 8080 (HTTP). No conflict.
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml -p extrapaints-staging up -d --build

services:
  db:
    container_name: extrapaints_staging_db

  redis:
    container_name: extrapaints_staging_redis

  web:
    container_name: extrapaints_staging_web

  nginx:
    container_name: extrapaints_staging_nginx
    ports:
      - "8080:80"
    volumes:
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
