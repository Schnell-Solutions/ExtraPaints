{# kind: product | color | idea — always shown (session or account saves) #}
<button
  type="button"
  class="ep-save-btn save-{{ kind }}-btn absolute {{ position|default:'top-3 right-3' }} z-20 p-2 rounded-full bg-white shadow-md ring-1 ring-black/10 text-neutral-600 hover:text-red-600 hover:bg-red-50 hover:ring-red-200 transition-all"
  {% if kind == 'product' %}data-product-id="{{ item_id }}"{% elif kind == 'color' %}data-color-id="{{ item_id }}"{% else %}data-idea-id="{{ item_id }}"{% endif %}
  data-is-saved="{{ is_saved|yesno:'true,false' }}"
  aria-label="{% if kind == 'product' %}Save product to collection{% elif kind == 'color' %}Save color to collection{% else %}Save idea to collection{% endif %}"
  title="{% if is_saved %}Saved{% else %}Add to favorites{% endif %}"
>
  <span class="heart-icon block pointer-events-none" aria-hidden="true">
    {% if icon_size == 'sm' %}
      {% if is_saved %}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      {% else %}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      {% endif %}
    {% else %}
      {% if is_saved %}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-500" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      {% else %}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      {% endif %}
    {% endif %}
  </span>
</button>
