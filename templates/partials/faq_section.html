{% if faq_items %}
<section class="mt-10 pt-10 border-t border-gray-200" id="faq">
  <h2 class="ep-section-title mb-6">Frequently asked questions</h2>
  <div class="space-y-3">
    {% for item in faq_items %}
    <details class="group bg-white border border-gray-200 rounded-md overflow-hidden">
      <summary class="cursor-pointer px-5 py-4 font-semibold text-primary-900 list-none flex justify-between items-center gap-4">
        <span>{{ item.question }}</span>
        <i data-lucide="chevron-down" class="w-5 h-5 shrink-0 transition-transform group-open:rotate-180" aria-hidden="true"></i>
      </summary>
      <div class="px-5 pb-4 text-gray-600 text-sm leading-relaxed border-t border-gray-100 pt-3">
        {{ item.answer }}
      </div>
    </details>
    {% endfor %}
  </div>
</section>
{% endif %}
