<div class="rounded-md border border-amber-200 bg-amber-50 p-5 mb-6" role="alert">
  <h3 class="text-lg font-semibold text-amber-900 mb-2">Referral code not found</h3>
  <p class="text-sm text-amber-800 mb-4">
    The referral code entered could not be found. You may continue without a referral code, or go back and correct the code.
  </p>
  <div class="flex flex-wrap gap-3">
    <button type="submit" name="skip_referral" value="1" class="px-5 py-2.5 rounded-md bg-primary-900 text-white text-sm font-semibold hover:bg-primary-800 transition-colors">
      Continue without code
    </button>
    <button type="button" onclick="document.querySelector('[name=referral_code]')?.focus()" class="px-5 py-2.5 rounded-md border border-gray-300 bg-white text-gray-800 text-sm font-medium hover:bg-gray-50 transition-colors">
      Back to form
    </button>
  </div>
</div>
