<form method="post" action="{{ request.path }}" class="space-y-3">
  {% csrf_token %}

  {% if form.non_field_errors %}
    <div class="p-2.5 bg-red-50 text-red-700 rounded-md text-sm border border-red-200">
      {% for error in form.non_field_errors %}
        <p>{{ error }}</p>
      {% endfor %}
    </div>
  {% endif %}

  {% for field in form %}
    <div>
      <input
        type="{{ field.field.widget.input_type|default:'text' }}"
        name="{{ field.name }}"
        id="{{ field.id_for_label }}"
        value="{{ field.value|default_if_none:'' }}"
        class="block w-full rounded-md border border-gray-300 px-3 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:border-primary-900 focus:outline-none focus:ring-1 focus:ring-primary-900 transition-colors"
        placeholder="{{ field.label }}{% if field.field.required %} *{% endif %}"
        {% if field.field.required %}required{% endif %}
      >
      {% if field.errors %}
        <p class="mt-1 text-xs text-red-600 ml-1">{{ field.errors.0 }}</p>
      {% endif %}
    </div>
  {% endfor %}

  <div class="pt-2">
    <button type="submit" class="w-full flex justify-center rounded-md bg-primary-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-primary-800 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-900 focus:ring-offset-2">
      Save Changes
    </button>
  </div>
</form>
