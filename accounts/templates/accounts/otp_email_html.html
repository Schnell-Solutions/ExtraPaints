<div style="font-family: 'Montserrat', Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #333;">
  <p style="font-size: 14px; color: #6b7280; margin: 0 0 8px;">{{ site_name }}</p>
  <h2 style="color: #060024; font-size: 20px; margin: 0 0 16px;">{{ purpose_label|title }}</h2>
  <p style="font-size: 16px; margin: 0 0 12px;">Hello <strong>{{ user_name }}</strong>,</p>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 20px;">
    Use this one-time code to continue. It expires in <strong>{{ ttl_minutes }} minutes</strong>.
  </p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 0.35em; color: #060024; margin: 0 0 24px; font-family: monospace;">
    {{ otp_code }}
  </p>
  <p style="font-size: 13px; color: #6b7280; line-height: 1.5; margin: 0; border-top: 1px solid #e5e7eb; padding-top: 16px;">
    If you did not request this, you can safely ignore this email.
  </p>
</div>
