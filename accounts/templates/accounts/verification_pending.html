{% extends 'base.html' %}

{% block title %}Verify your email | ExtraPaints{% endblock %}
{% block description %}Check your email for a verification code.{% endblock %}

{% block content %}
<section class="ep-auth-page">
  <div class="ep-auth-container">
    <h1 class="ep-page-title">Check your email</h1>
    <p class="ep-auth-lead">We sent a 6-digit code to activate your account.</p>

    <div class="ep-auth-form space-y-3">
      <a href="{% url 'verify_email_otp' %}" class="ep-btn ep-btn-primary w-full py-3">Enter code</a>
      <a href="{% url 'resend_verification' %}" class="ep-btn ep-btn-secondary w-full py-3">Resend code</a>
    </div>
  </div>
</section>
{% endblock %}
