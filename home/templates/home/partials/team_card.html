{% load static %}
<div class="text-center p-4 border border-gray-300 rounded-xl bg-white">
    <div class="w-28 h-28 mx-auto mb-4 overflow-hidden rounded-full
            hover:rounded-xl
            border-2 border-primary-900/40
            transition-all duration-500 ease-in-out">
        <img src="{% static image_url %}" alt="{{ name }}" class="w-full h-full object-cover">
    </div>

    <h4 class="text-lg font-bold text-primary-900 mb-1">{{ name }}</h4>
    <p class="text-sm font-medium text-primary-900 uppercase tracking-wider mb-3">{{ title }}</p>
    <p class="text-xs text-gray-500 italic">{{ bio }}</p>
</div>
