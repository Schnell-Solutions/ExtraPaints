<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
    <div style="background-color: #060024; color: #fff; padding: 15px 20px;">
        <h1 style="margin: 0; font-size: 20px;">{{ headline|default:"Thank you" }}</h1>
    </div>
    <div style="padding: 20px 25px; line-height: 1.6; color: #333;">
        {% if customer_name %}<p>Hi {{ customer_name }},</p>{% endif %}
        <p>{{ body }}</p>
        <p style="margin-top: 20px; font-size: 14px; color: #6b7280;">
            — The {{ site_name }} sales team
        </p>
    </div>
    <div style="background-color: #f8fbff; color: #6b7280; padding: 15px; font-size: 12px; text-align: center; border-top: 1px solid #e5e7eb;">
        This is an automated confirmation. Reply to this email if you need to add details.
    </div>
</div>
